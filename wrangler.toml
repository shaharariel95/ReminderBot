name = "nu-bot"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# One tick per minute = ~1,440 invocations/day. The free plan gives 100,000/day.
# Free plan allows up to 3 cron triggers per Worker; we only ever need this one,
# because scheduling lives in the database, not in cron expressions.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nu-bot"
database_id = "94c7c9d0-b8b5-4305-8c0f-7588c1c6a140"

[vars]
DEFAULT_TZ = "Asia/Jerusalem"
# Your key also has gemini-3.5-flash-lite (newer, same tier) and
# gemini-flash-lite-latest (auto-updating, but the persona may drift when
# Google rolls it forward). 2.5 is pinned and shuts down 16 Oct 2026.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Secrets — set with `npx wrangler secret put <NAME>`. Never put them in this file.
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   GEMINI_API_KEY
#   OWNER_CHAT_ID
