name = "nu-bot"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# One tick per minute = ~1,440 invocations/day. The free plan gives 100,000/day.
# Free plan allows up to 3 cron triggers per Worker; we only ever need this one,
# because scheduling lives in the database, not in cron expressions.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nu-bot"
database_id = "94c7c9d0-b8b5-4305-8c0f-7588c1c6a140"

[vars]
DEFAULT_TZ = "Asia/Jerusalem"
# Primary is the stronger free-tier model; the fallback catches its tighter
# rate limit — it's the model this project ran successfully before this
# change, so it's a known-good floor. Verify the current free-tier
# requests/day for both before changing these — the published numbers move.
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_MODEL_FALLBACK = "gemini-3.5-flash-lite"
# Past this many primary-model calls in a UTC day, low-priority messages
# (unprompted check-ins) stop calling the model and ship voice.ts output
# directly. Reminders and nags are never throttled.
GEMINI_SOFT_LIMIT = "200"

# Secrets — set with `npx wrangler secret put <NAME>`. Never put them in this file.
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   GEMINI_API_KEY
#   OWNER_CHAT_ID
