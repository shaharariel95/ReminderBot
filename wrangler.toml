name = "nu-bot"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# One tick per minute = ~1,440 invocations/day. The free plan gives 100,000/day.
# Free plan allows up to 3 cron triggers per Worker; we only ever need this one,
# because scheduling lives in the database, not in cron expressions.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nu-bot"
database_id = "94c7c9d0-b8b5-4305-8c0f-7588c1c6a140"

[vars]
DEFAULT_TZ = "Asia/Jerusalem"
# Primary is the stronger free-tier model; the fallback catches its tighter
# rate limit — it's the model this project ran successfully before any of the
# laddering, so it's a known-good floor.
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_MODEL_FALLBACK = "gemini-3.5-flash-lite"
# ...and everything under them, best first. The free tier meters requests per
# minute PER MODEL against one key, so each extra rung is extra capacity, not
# just redundancy: two rungs deep, a busy minute ran out of models while
# others sat unasked.
#
# Verify these ids before editing — the published free-tier list moves. A name
# that no longer exists is not a silent failure: it 404s, writes itself off for
# hours (see gemini.blockFor) and is named by /diag, so the cost of a stale
# entry is one round trip a day and a visible line. Unset entirely, the ladder
# falls back to gemini.DEFAULT_LADDER, which is this same list.
GEMINI_MODELS = "gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite"
# Past this many model calls in a local day — across the whole ladder, per
# chat — low-priority messages (unprompted check-ins) stop calling the model
# and ship voice.ts output directly. Reminders and nags are never throttled.
GEMINI_SOFT_LIMIT = "200"
# The axis the free tier actually enforces: requests per MINUTE, per model.
# Real ceiling is 20; 18 leaves room for the retry a 429 would otherwise cost.
GEMINI_RPM = "18"

# Secrets — set with `npx wrangler secret put <NAME>`. Never put them in this file.
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   GEMINI_API_KEY
#   OWNER_CHAT_ID
