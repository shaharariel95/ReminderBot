name = "nu-bot"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# One tick per minute = ~1,440 invocations/day. The free plan gives 100,000/day.
#
# TWO entries, not one, and the second is not redundancy for its own sake.
# Cloudflare's cron is best-effort: over the 24h to 02.09.2026 the Worker was
# invoked on 1251 of ~1420 minutes — thirteen gaps of 3-5 minutes, plus one of
# 28. On 01.09 it skipped eighty minutes in a row and reminder #69, due 16:30,
# rang at 17:50. The trigger was registered and correct the whole time; the
# platform simply did not call it.
#
# A second expression is a SEPARATE schedule entry, so a drop in one does not
# imply a drop in the other. It is not a second tick: db.claimTick makes the
# work exclusive within a window, so the */5 entry only ever does anything on
# a minute the every-minute entry missed. Adding this without that claim would
# double-fire every fifth minute.
[triggers]
crons = ["* * * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nu-bot"
database_id = "94c7c9d0-b8b5-4305-8c0f-7588c1c6a140"

[vars]
DEFAULT_TZ = "Asia/Jerusalem"
# The two that lead the ladder. gemini.modelLadder puts these FIRST, ahead of
# GEMINI_MODELS.
#
# 0.16.0 changed these to 3.7 and 3.6 on the reasoning that the ladder was
# "inverted" — that routing, the hardest call in the system, was being done by
# the weakest model configured, while two better ones sat below, never reached.
# The evidence for "better" was the version number.
#
# Reverted in 0.16.2, because production measured them inside forty minutes:
#
#   /diag probe   HTTP 200 in 4049ms, then HTTP 503 in 9059ms
#   22:27 turn    18.9s to route; the invocation died before sending anything
#   22:43 turn    3.7 and 3.6 EACH burned the full 12s per-call timeout,
#                 leaving 3.5-flash 635ms of a 25s turn. Two reminders lost.
#
# "Never reached" is what a working ladder looks like when the first two rungs
# are fast. The lower rungs are CAPACITY — a separate per-minute quota each —
# not a queue of better answers waiting to be let in. And the failure that
# prompted the change (a runaway `title`) happens on every rung, because it is
# a schema problem, not a model-quality one.
#
# The rule this leaves behind: what leads this ladder is a model with a
# production track record. Promote something by measuring it — deploy it low,
# watch /diag and the `usage` table — not by reading its version number.
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_MODEL_FALLBACK = "gemini-3.5-flash-lite"
# ...and everything under them, best first. The free tier meters requests per
# minute PER MODEL against one key, so each extra rung is extra capacity, not
# just redundancy: two rungs deep, a busy minute ran out of models while
# others sat unasked.
#
# Verify these ids before editing — the published free-tier list moves. A name
# that no longer exists is not a silent failure: it 404s, writes itself off for
# hours (see gemini.blockFor) and is named by /diag, so the cost of a stale
# entry is one round trip a day and a visible line. Unset entirely, the ladder
# falls back to gemini.DEFAULT_LADDER, which is this same list — and
# test/v26.test.ts asserts that, because for nine versions it was not: the
# 0.16.2 demotion of 3.7/3.6 was applied here and not there.
#
# Re-verified 06.09.2026 against ai.google.dev's model and pricing pages. Eight
# Flash / Flash-Lite ids carry a free tier; four of them were configured. Since
# the free tier meters per minute PER MODEL against one key, the four missing
# were not idle redundancy — they were capacity that did not exist.
#
# 3.1-flash-lite and 3.8-flash are new here and have no production record, so
# they sit below the two that have one. The 2.5 pair were removed on 19.08.2026
# for 404ing and are last: the docs say they are free-tier again, a docs page
# is a claim, and a 404 costs one round trip per six hours and a /diag line.
GEMINI_MODELS = "gemini-3.7-flash,gemini-3.6-flash,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-2.5-flash-lite,gemini-2.5-flash"
# Past this many model calls in a local day — across the whole ladder, per
# chat — low-priority messages (unprompted check-ins) stop calling the model
# and ship voice.ts output directly. Reminders and nags are never throttled.
GEMINI_SOFT_LIMIT = "200"
# The axis the free tier actually enforces: requests per MINUTE, per model.
# Real ceiling is 20; 18 leaves room for the retry a 429 would otherwise cost.
GEMINI_RPM = "18"

# Secrets — set with `npx wrangler secret put <NAME>`. Never put them in this file.
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   GEMINI_API_KEY
#   OWNER_CHAT_ID
